name: update

# Pulls Kalshi props + ESPN stats and Kalshi vs Polymarket US game prices, then publishes the site.
on:
  schedule:
    - cron: "2,12,22,32,42,52 * * * *"   # about every 10 minutes
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "site/**"
      - "requirements.txt"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore data cache
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: data-${{ github.run_id }}
          restore-keys: data-

      - name: Build board
        run: python -m pipeline.build

      - name: Scan Kalshi vs Polymarket US for arbitrage
        continue-on-error: true
        timeout-minutes: 8
        run: python -m pipeline.arb

      - name: Save data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: data-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publish site to gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf /tmp/site && cp -r site /tmp/site
          touch /tmp/site/.nojekyll
          cd /tmp/site
          git init -q -b gh-pages
          git config user.name "prop-finder-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "update $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages:gh-pages

      # GitHub pauses scheduled jobs in public repos after 60 days without a commit.
      # One tiny commit a month keeps the 20-minute updates running indefinitely.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( ($(date +%s) - last) / 86400 )) -ge 30 ]; then
            git config user.name "prop-finder-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            date -u +%FT%TZ > .github/keepalive
            git add .github/keepalive
            git commit -q -m "Keep scheduled updates running"
            git push -q origin HEAD:main
          fi
