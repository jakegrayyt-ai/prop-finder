name: arb-discover

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pipeline/arb_discover.py"
      - ".github/workflows/arb-discover.yml"

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pipeline.arb_discover
      - name: Publish debug output to the debug branch
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p debug && cd debug
          git init -q -b debug
          git config user.name "prop-finder-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "arb discovery $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" debug:debug
