name: probe

# Test runs on the wip branch only. Output goes to the debug branch.
on:
  push:
    branches: [wip]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run
        run: |
          if [ -f probe_cmd ]; then bash probe_cmd; else python -m pipeline.probe_team; fi
      - name: Publish debug output to the debug branch
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p debug && cd debug
          git init -q -b debug
          git config user.name "prop-finder-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "probe $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" debug:debug
